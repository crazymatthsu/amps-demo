# Same shape as the demo's, with the container plumbing quietened: Testcontainers
# and docker-java narrate every API call at INFO, and the failover timeline is
# what these logs are for.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.log.org.testcontainers=warn
org.slf4j.simpleLogger.log.com.github.dockerjava=warn
org.slf4j.simpleLogger.log.tc=warn
