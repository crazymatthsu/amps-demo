# FIX 4.2 delta publisher -- the rulebook.
#
# Everything about WHICH tags leave this process lives here. A route says
# "for this message type, extract these fields and send them to these topics",
# and the publisher does no more than that: it never accumulates chain state,
# because the AMPS chaining key generator resolves 11/41 server-side.
#
# Two things are checked at startup and refuse to boot (Fix42Properties.validate):
#   - a DELTA route whose tag list omits its destination topic's SOW key. AMPS
#     rejects a SOW publish that lacks its key field, and a message the server
#     will not store is a miserable thing to diagnose from the outside.
#   - a topic named by a route with no entry under topic-keys, so the check
#     above cannot be made at all.

spring:
  main:
    banner-mode: off

logging:
  level:
    com.demo.amps.fix42: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %-28logger{0} %msg%n"

fix42:

  amps:
    # The trailing path selects the MESSAGE TYPE, not just the protocol. Every
    # topic below is <MessageType>fix</MessageType>, so this must end /amps/fix.
    uri: tcp://127.0.0.1:9007/amps/fix
    client-name: fix42-delta-publisher
    timeout-ms: 10000

  # The SOW key of every topic, mirroring <Key> in
  # server/config/flows/fix42-chaining/amps-config.xml. Duplicated here on
  # purpose: the publisher cannot read the server's config, and validating
  # against a stale copy still catches the common mistake (a field list that
  # forgot the key) while a mismatch shows up immediately as a rejected publish.
  #
  # sow/fix42/orders is keyed by the CHAINING MODULE from /11 + /41. Tag 11 is
  # the module's primary and is required on every message; 41 is the optional
  # back-reference, absent on the first message of a chain, so only 11 is
  # listed as required.
  #
  # Parent orders and child slices share these topics. A child chain has its
  # own 11/41 lineage, so the module keeps it as a separate record; tag 9000
  # (ParentOrderID) rides along as an ordinary field, which is what a filter
  # walks to find a parent's children (/9000 = '<parent ClOrdID>').
  topic-keys:
    "[sow/fix42/orders]": [11]
    "[sow/fix42/orders_audit]": [11]
    "[sow/fix42/execs]": [37]
    "[sow/fix42/execs_audit]": [17]
    "[sow/fix42/rejects]": [11]

  # Matched in order; first match wins.
  #
  # A topic may carry {scope}, which becomes 'parent' or 'child' from tag 9000
  # (ParentOrderID) on the message. None of the topics below use it: parents
  # and children share sow/fix42/orders, and the module keeps their chains
  # apart on its own. The knob is there for a deployment that wants two
  # blotters -- declare sow/parent/* and sow/child/* on the server, list them
  # under topic-keys, and write sow/{scope}/orders here.
  #
  # Two destinations per route, and the difference is the point:
  #
  #   topics            get the payload as selected -- what was actually sent.
  #                     The audit topics, which should record the message, not
  #                     a rewrite of it.
  #   projected-topics  get the payload reshaped by the `projection` block.
  #                     The chained blotter, where a PROPOSAL must never
  #                     overwrite an ACKED value.
  #
  # The pending-state family (9010 PendingOrderQty, 9011 PendingPrice,
  # 9012 PendingClOrdID, 9013 PendingAction) exists because FIX 4.2 stages an
  # amend's terms until the venue confirms, and a delta merge has no notion of
  # staging. Publishing a 35=G's tag 38 straight onto the blotter overwrites
  # the quantity the venue acked -- and if the amend is rejected there is no
  # way back, because a merge can overwrite but never remove. Keeping the
  # proposal in its own tags means the conflict never arises, and the record
  # answers both questions at once.
  #
  # Clearing is a WRITE of NONE/0, not a removal, for the same reason.
  routes:

    # ---- 35=D NewOrderSingle -------------------------------------------------
    # The whole message: this is what CREATES the record, and every later delta
    # relies on the terms it carries still being there. The blotter copy also
    # seeds the pending family, so 9013 is never absent on a record.
    - name: new-order
      msg-types: ["D"]
      mode: FULL
      topics:
        - "sow/fix42/orders_audit"
      projected-topics:
        - "sow/fix42/orders"
      projection:
        copy-tags:
          "11": 9014           # the opening ClOrdID is the working one
        set-tags:
          "9013": "NEW"        # a 35=D is itself a request awaiting an ack
          "9010": "0"
          "9011": "0"
          "9012": "NONE"

    # ---- 35=G OrderCancelReplaceRequest --------------------------------------
    # The audit topic gets the amend as sent, tags 38/44 and all.
    # The blotter gets the SAME VALUES under 9010/9011 and never sees 38/44,
    # so the acked terms in the record survive untouched.
    #
    # changeable-tags is still the knob a desk turns; adding 110 (MinQty) here
    # means adding a 110 -> 90xx entry to copy-tags as well.
    - name: amend
      msg-types: ["G"]
      mode: DELTA
      tags: [35, 11, 41, 60]
      changeable-tags: [38, 44, 59]
      topics:
        - "sow/fix42/orders_audit"
      projected-topics:
        - "sow/fix42/orders"
      projection:
        # 11 and 41 go through UNCHANGED. They are the chaining key
        # generator's own inputs: it binds this new ClOrdID into the existing
        # chain by seeing 11=<new> next to 41=<known>. Rewrite either one and
        # the module opens a second chain instead -- the order splits in two.
        tags: [35, 11, 41, 60]
        copy-tags:
          "38": 9010           # proposed OrderQty -> PendingOrderQty
          "44": 9011           # proposed Price    -> PendingPrice
          "11": 9012           # the request's own id -> PendingClOrdID
        set-tags:
          "9013": "REPLACE"
        # 9014 is deliberately absent: a delta leaves it alone, so the working
        # id stays what the venue last confirmed while this amend is in flight.

    # ---- 35=F OrderCancelRequest ---------------------------------------------
    # Same shape, no proposed terms: a cancel changes nothing but intent.
    - name: cancel-request
      msg-types: ["F"]
      mode: DELTA
      tags: [35, 11, 41, 60]
      topics:
        - "sow/fix42/orders_audit"
      projected-topics:
        - "sow/fix42/orders"
      projection:
        tags: [35, 11, 41, 60]
        copy-tags:
          "11": 9012
        set-tags:
          "9013": "CANCEL"

    # ---- 35=8 ExecutionReport ------------------------------------------------
    # Split by ExecType (150). Every variant includes 37 and 17: they key
    # sow/fix42/execs and sow/fix42/execs_audit, and a SOW publish without
    # its key is rejected.
    #
    # The variants that RESOLVE a pending request also project onto the order
    # blotter to clear it, and so does every variant that MOVES a quantity or
    # a term -- fills, restatements, and the terminal reports (cancel, done,
    # expired, rejected) that take LeavesQty to zero. The exposure views
    # (view/fix42/exposure/*) aggregate the blotter's 151, so a terminal
    # report that never reaches it leaves the order counted as working
    # exposure indefinitely. Only the pending acknowledgements (A/6/E) stay
    # off the blotter: they change nothing yet.

    # Trade bust (20=1) and trade correct (20=2) -- matched on ExecTransType
    # and declared BEFORE the 150-based rules, because a 4.2 bust/correct
    # carries an ordinary 150 mirroring the restated status, and the fill
    # rules would swallow it. The venue restates 14/151/6/39 as ABSOLUTES
    # (docs/fix42/01, section 2), which is why the blotter can simply adopt
    # them: the same merge that applies a fill applies its reversal. Tags
    # 19/20 ride to the exec topics so a reader can tell WHICH execution was
    # undone -- with the same caveat as 31/32 on sow/fix42/execs: they mean
    # "the most recent report", and persist until something overwrites them.
    - name: exec-bust
      msg-types: ["8"]
      exec-trans-types: ["1"]
      mode: DELTA
      tags: [35, 11, 41, 37, 17, 19, 20, 39, 150, 60]
      changeable-tags: [38, 14, 151, 6]
      topics:
        - "sow/fix42/execs"
        - "sow/fix42/execs_audit"
      projected-topics:
        - "sow/fix42/orders"
      projection:
        # Restated absolutes only. Deliberately NO 31/32 -- a bust reports no
        # new trade, so the blotter keeps the last real fill's values -- and
        # NO 19/20: they describe a PRIOR execution, and left on the merged
        # record they would go stale the moment the next fill arrives. No
        # pending tags either; a bust answers no request.
        tags: [11, 41, 39, 150, 60, 38, 14, 151, 6]

    # A correct replaces a prior fill's economics, so unlike a bust it DOES
    # carry trade fields: the correcting report's 32/31 become the current
    # values (docs/fix42/01, section 5), on the blotter too.
    - name: exec-correct
      msg-types: ["8"]
      exec-trans-types: ["2"]
      mode: DELTA
      tags: [35, 11, 41, 37, 17, 19, 20, 39, 150, 60]
      changeable-tags: [38, 31, 32, 30, 14, 151, 6]
      topics:
        - "sow/fix42/execs"
        - "sow/fix42/execs_audit"
      projected-topics:
        - "sow/fix42/orders"
      projection:
        tags: [11, 41, 39, 150, 60, 38, 14, 151, 6, 32, 31, 30]

    # New ack: the order is working. Clears the NEW pending flag.
    - name: exec-new-ack
      msg-types: ["8"]
      exec-types: ["0"]
      mode: DELTA
      tags: [35, 11, 41, 37, 17, 39, 150, 60]
      topics:
        - "sow/fix42/execs"
        - "sow/fix42/execs_audit"
      projected-topics:
        - "sow/fix42/orders"
      projection:
        # 39/150 say what the venue did; 14/151/6/38 are its quantities. An
        # ack carries 14=0 and 151=OrderQty, which is what seeds the blotter:
        # until a report arrives the record has terms but no quantities, since
        # a 35=D has none to give.
        tags: [11, 41, 39, 150, 60, 38, 14, 151, 6]
        copy-tags:
          "11": 9014             # the venue has acknowledged this id
        set-tags:
          "9013": "NONE"
          "9012": "NONE"

    # Replace confirmed: the amend is accepted. The venue's own 38/44 become
    # the acked terms -- we adopt what it says it accepted rather than what we
    # asked for -- and the pending family is cleared in the same message.
    - name: exec-replace-confirm
      msg-types: ["8"]
      exec-types: ["5"]
      mode: DELTA
      tags: [35, 11, 41, 37, 17, 39, 150, 60]
      changeable-tags: [38, 44, 14, 151, 6]
      topics:
        - "sow/fix42/execs"
        - "sow/fix42/execs_audit"
      projected-topics:
        - "sow/fix42/orders"
      projection:
        tags: [11, 41, 39, 150, 60, 38, 44, 14, 151, 6]
        copy-tags:
          "11": 9014             # the amended id is now the working one
        set-tags:
          "9013": "NONE"
          "9010": "0"
          "9011": "0"
          "9012": "NONE"

    # Partial and full fills: economics only, no pending change, no blotter
    # projection.
    #
    # Each fill carries this fill (31/32), the cumulative snapshot (14/151/6),
    # and the OrderQty (38) those are measured against. 38 is published even
    # though a fill never changes it, so the stored record can be checked
    # against itself: OrderQty = CumQty + LeavesQty holds on every working
    # report. Without it the invariant is unverifiable from the record alone --
    # 38 would arrive only from other report types, and a chain that never
    # amends may never send one.
    #
    # Note what is deliberately NOT in the other exec routes: 31/32 belong to
    # fills only. An ack (150=0) or a cancel (150=4) reports no trade, so it
    # carries no LastPx/LastShares, while CumQty keeps its running total. And
    # 31 is THIS fill's price where 6 is the weighted average of every fill so
    # far -- different questions, and easy to confuse.
    - name: exec-partial-fill
      msg-types: ["8"]
      exec-types: ["1"]
      mode: DELTA
      tags: [35, 11, 41, 37, 17, 39, 150, 60]
      changeable-tags: [38, 31, 32, 14, 151, 6, 30]
      topics:
        - "sow/fix42/execs"
        - "sow/fix42/execs_audit"
      projected-topics:
        - "sow/fix42/orders"
      projection:
        # The execution economics onto the order blotter: the cumulative
        # snapshot (14/151/6), this fill (32/31/30), and the OrderQty they are
        # measured against.
        #
        # NO pending tags here, deliberately. A fill does not resolve an
        # outstanding request: an order can be partially filled while a cancel
        # or amend is still in flight, and both facts are true at once. The
        # pending family stays as it is until an 8 with 150=4/5 or a 35=9
        # answers the request -- so OrdStatus and PendingAction are separate
        # fields on this record precisely because they answer different
        # questions.
        #
        # 150 rides along so a reader can tell what the last report WAS. That
        # matters on a merged record: 32/31 are written only by fills, so
        # after a cancel they still hold the last fill's values. They mean
        # "the most recent execution", not "this report".
        tags: [11, 41, 39, 150, 60, 38, 14, 151, 6, 32, 31, 30]

    - name: exec-fill
      msg-types: ["8"]
      exec-types: ["2"]
      mode: DELTA
      tags: [35, 11, 41, 37, 17, 39, 150, 60]
      changeable-tags: [38, 31, 32, 14, 151, 6, 30]
      topics:
        - "sow/fix42/execs"
        - "sow/fix42/execs_audit"
      projected-topics:
        - "sow/fix42/orders"
      projection:
        # The execution economics onto the order blotter: the cumulative
        # snapshot (14/151/6), this fill (32/31/30), and the OrderQty they are
        # measured against.
        #
        # NO pending tags here, deliberately. A fill does not resolve an
        # outstanding request: an order can be partially filled while a cancel
        # or amend is still in flight, and both facts are true at once. The
        # pending family stays as it is until an 8 with 150=4/5 or a 35=9
        # answers the request -- so OrdStatus and PendingAction are separate
        # fields on this record precisely because they answer different
        # questions.
        #
        # 150 rides along so a reader can tell what the last report WAS. That
        # matters on a merged record: 32/31 are written only by fills, so
        # after a cancel they still hold the last fill's values. They mean
        # "the most recent execution", not "this report".
        tags: [11, 41, 39, 150, 60, 38, 14, 151, 6, 32, 31, 30]

    # Cancel confirmed (150=4) and done for day (150=3): terminal, LeavesQty
    # goes to zero, and any pending request is resolved.
    - name: exec-cancel-or-done
      msg-types: ["8"]
      exec-types: ["4", "3"]
      mode: DELTA
      tags: [35, 11, 41, 37, 17, 39, 150, 60]
      changeable-tags: [151]
      topics:
        - "sow/fix42/execs"
        - "sow/fix42/execs_audit"
      projected-topics:
        - "sow/fix42/orders"
      projection:
        # 151 goes to zero here and the blotter has to show it, or a cancelled
        # order still reads as working. 14/6 keep the totals the fills left.
        #
        # 151 is BOTH selected and stamped. A projection applies its literals
        # last, so the stamp wins: a venue that omits LeavesQty on a cancel
        # (some do -- the balance is gone, so why report it) would otherwise
        # leave the last fill's 151 on the record, and the exposure views
        # would keep counting it as working. Listing 151 in tags as well is
        # not a conflict: the planner applies literals last, and validate()
        # sees both as produced tags. It stays in the list to say the venue's
        # value is expected, and to keep the payload shape obvious.
        tags: [11, 41, 39, 150, 60, 14, 151, 6]
        set-tags:
          "151": "0"
          "9013": "NONE"
          "9010": "0"
          "9011": "0"
          "9012": "NONE"

    # Expired (150=C) and rejected (150=8): terminal in exactly the way a
    # cancel is. The unfilled balance stops working, so LeavesQty is zero and
    # any request in flight is moot -- a GTD order past its ExpireTime, a day
    # order at the close, a 35=D the venue refused (in which case this is the
    # first and last report of the chain, and 39=8 is what the blotter keeps).
    #
    # Declared ahead of exec-other on purpose. Before this route existed both
    # fell into the catch-all, which has no blotter projection: the execs
    # topics showed 151=0 while sow/fix42/orders kept the last working 151,
    # and the exposure views summed it as live exposure until something
    # unrelated happened to overwrite the record. Reproduced on 5.3.5.135
    # (docs/fix42-view/10).
    #
    # 103 (OrdRejReason) and 58 (Text) ride to the exec topics, where a
    # reader looks for why. Same projection as exec-cancel-or-done, same
    # forced 151=0, and 11/41 pass through untouched -- they are the chaining
    # key generator's inputs, so a reject on an amended chain still lands on
    # the chain's record.
    - name: exec-expired-or-rejected
      msg-types: ["8"]
      exec-types: ["C", "8"]
      mode: DELTA
      tags: [35, 11, 41, 37, 17, 39, 150, 60]
      changeable-tags: [14, 151, 6, 38, 103, 58]
      topics:
        - "sow/fix42/execs"
        - "sow/fix42/execs_audit"
      projected-topics:
        - "sow/fix42/orders"
      projection:
        tags: [11, 41, 39, 150, 60, 14, 151, 6]
        set-tags:
          "151": "0"
          "9013": "NONE"
          "9010": "0"
          "9011": "0"
          "9012": "NONE"

    # Restated (150=D): the venue changed the order's terms on its own, with
    # no request from this side -- a GT renewal, a corporate action, an
    # exchange-initiated partial decline of OrderQty (378 says which). The
    # report carries the restated terms and quantities as absolutes, so the
    # blotter adopts them the way it adopts a replace confirm's: 38/44 become
    # the acked terms, 14/151/6 the restated totals.
    #
    # NO pending tags, deliberately. A restatement answers no request, and
    # an amend may be in flight while the venue restates -- both are true at
    # once, so the proposal stays where it is until its own 150=5 or 35=9.
    # 378 goes to the exec topics only: like 19/20 on a bust, it describes
    # THIS report and would sit stale on the merged record.
    - name: exec-restated
      msg-types: ["8"]
      exec-types: ["D"]
      mode: DELTA
      tags: [35, 11, 41, 37, 17, 39, 150, 60]
      changeable-tags: [38, 44, 14, 151, 6, 378, 58]
      topics:
        - "sow/fix42/execs"
        - "sow/fix42/execs_audit"
      projected-topics:
        - "sow/fix42/orders"
      projection:
        tags: [11, 41, 39, 150, 60, 38, 44, 14, 151, 6]

    # Everything else on a 35=8: pending new (A), pending cancel (6), pending
    # replace (E). A catch-all rather than a gap -- an unrouted message raises
    # at plan time, because a silent drop looks exactly like an AMPS bug from
    # the far side.
    #
    # No blotter projection: these ACKNOWLEDGE a request rather than
    # resolving it, so the pending family must stay as it is, and they move
    # no quantity. A new 150 value that lands here by default is worth a
    # second look -- a terminal or restating report belongs in one of the
    # projecting routes above, or the blotter keeps stale exposure.
    - name: exec-other
      msg-types: ["8"]
      mode: DELTA
      tags: [35, 11, 41, 37, 17, 39, 150, 60]
      changeable-tags: [14, 151, 6, 38, 44, 103, 58]
      topics:
        - "sow/fix42/execs"
        - "sow/fix42/execs_audit"

    # ---- 35=9 OrderCancelReject ----------------------------------------------
    # Keyed on tag 11, the REJECTED request's id -- one record per rejected
    # request. Not keyed on OrderID: a 4.2 reject may carry 37=NONE when the
    # target was never acked.
    #
    # On the blotter this is the case the whole pending family exists for.
    # There is nothing to revert, because 38/44 were never overwritten: the
    # projection just clears the proposal. The working id needs no revert
    # either, because a request never publishes 9014.
    - name: cancel-reject
      msg-types: ["9"]
      mode: DELTA
      tags: [35, 11, 41, 37, 39, 434, 60]
      changeable-tags: [102, 58]
      topics:
        - "sow/fix42/rejects"
      projected-topics:
        - "sow/fix42/orders"
      projection:
        # 11/41 unchanged so the module still resolves the chain. 9014 is not
        # published, so the working id stays what it was before the rejected
        # request -- no revert needed, because nothing overwrote it.
        tags: [11, 41, 39, 60]
        set-tags:
          "9013": "NONE"
          "9010": "0"
          "9011": "0"
          "9012": "NONE"
