[versions]
# AMPS Java client, published to Maven Central by 60East Technologies.
amps = "5.3.5.3"
protobuf = "4.35.1"
protobufPlugin = "0.9.5"
slf4j = "2.0.17"
junit = "5.13.4"
# Already arrives transitively with protobuf-java-util, but the utils module
# parses JSON envelopes directly, so it declares what it uses rather than
# compiling against someone else's transitive dependency.
gson = "2.11.0"
# The FIX 4.2 delta publisher (fix42-publisher) is a Spring Boot application:
# YAML-bound configuration is the feature it is actually there to use, since
# every field-selection rule in it is config rather than code.
springBoot = "3.5.9"
awaitility = "4.3.0"
# Hazelcast open source (community edition). Its MapStore SPI is the sanctioned
# persistence mechanism in OSS -- native Persistence is Enterprise-only -- and
# hazelcast-persistent-store implements that SPI on top of AMPS SOW topics.
hazelcast = "5.5.0"
# Test-scope only: starts the AMPS container for fix42-publisher's integration
# suite. Needs a Docker-API-compatible socket, which a GitHub runner has by
# default and an Apple Silicon laptop running podman does not.
testcontainers = "1.21.3"
# QuickFIX/J 2.x -- the last major on the pre-Java-17 API line, and the one
# quickfixj-v2-demo builds its AMPS-replicated sequence-number store against.
# The FIX 4.2 message classes and the standard FIX42.xml dictionary ship in
# the messages-fix42 artifact; core alone has no message types in it.
quickfixj = "2.3.3"

[libraries]
amps-client = { module = "com.crankuptheamps:amps-client", version.ref = "amps" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
hazelcast = { module = "com.hazelcast:hazelcast", version.ref = "hazelcast" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
quickfixj-core = { module = "org.quickfixj:quickfixj-core", version.ref = "quickfixj" }
quickfixj-messages-fix42 = { module = "org.quickfixj:quickfixj-messages-fix42", version.ref = "quickfixj" }
# Spring Integration, at the version the Spring Boot BOM pins (6.5.x for Boot 3.5).
spring-boot-starter-integration = { module = "org.springframework.boot:spring-boot-starter-integration" }
# Hibernate Validator: @Validated @ConfigurationProperties silently skips @NotBlank
# unless a validator is on the classpath, and amps-connectors is configuration first.
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
# Jackson, for the JSON record decoder/encoder -- the starter, not the web server.
spring-boot-starter-json = { module = "org.springframework.boot:spring-boot-starter-json" }
# The web server a connector application runs only so that actuator has somewhere
# to live; connectors themselves are outbound clients.
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
# /actuator/health/readiness is what the container HEALTHCHECK and compose probes call.
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
# Kafka consumer for :amps-connectors:source-kafka, at the version the Boot BOM pins.
kafka-clients = { module = "org.apache.kafka:kafka-clients" }
# A real database in-process for :amps-connectors:source-jdbc's tests: DDL, DML and
# result-set typing are what that source is made of, and none of it is worth mocking.
h2 = { module = "com.h2database:h2" }
# The one JDBC driver the generic runner image carries, so a config-only connector
# can dial a real database without a rebuild. Version from the Boot BOM.
postgresql = { module = "org.postgresql:postgresql" }

[plugins]
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
