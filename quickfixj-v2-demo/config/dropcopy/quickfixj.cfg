# QuickFIX/J session settings -- the DROPCOPY side.
#
# An initiator that logs on to the venue's drop-copy gateway and receives the
# execution reports. Everything it receives goes through the rules and
# destinations in this role's dropcopy.yml.
#
# ${NAME:default} placeholders are resolved by the application before the
# file reaches QuickFIX/J (system property, then environment variable, then
# the default). QFJ_VENUE_HOST is what compose.yml sets to reach the venue
# container by service name.

[default]
ConnectionType=initiator
SocketConnectHost=${QFJ_VENUE_HOST:127.0.0.1}
SocketConnectPort=${QFJ_VENUE_PORT:9876}
ReconnectInterval=5
LogonTimeout=10
LogoutTimeout=5

# QFJ_STORE_DIR is how `dropcopy-compose.sh failover` starts the replacement
# instance on an empty store while leaving the primary's in place.
FileStorePath=${QFJ_STORE_DIR:data/store}
FileStoreSync=Y

FileLogPath=log/fix
FileLogHeartbeats=N

UseDataDictionary=Y
DataDictionary=config/dictionary/FIX42.xml
ValidateUserDefinedFields=N
AllowUnknownMsgFields=Y

NonStopSession=Y
StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30
ResetOnLogon=N
ResetOnLogout=N
ResetOnDisconnect=N
RefreshOnLogon=N
RejectMessageOnUnhandledException=N

[session]
BeginString=FIX.4.2
SenderCompID=DROPCOPY
TargetCompID=VENUE
