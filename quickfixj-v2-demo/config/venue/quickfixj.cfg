# QuickFIX/J session settings -- the VENUE side.
#
# An acceptor standing in for an execution venue's drop-copy gateway: it
# accepts one session from DROPCOPY and, with qfj.mock.enabled=true in this
# role's venue.yml, streams execution reports down it.
#
# ${NAME:default} placeholders are resolved by the application before the
# file reaches QuickFIX/J (system property, then environment variable, then
# the default), which is how the same file serves `bootRun` on a laptop and
# the container in compose.yml.
#
# Paths are relative to the working directory: the module folder under
# bootRun, /app in the container. compose.yml bind-mounts config/, data/ and
# log/ there, so the store and the session logs land on the host.

[default]
ConnectionType=acceptor
SocketAcceptPort=${QFJ_VENUE_PORT:9876}

# The sequence-number file store QuickFIX/J writes on every send and receive.
# The application wraps it: every change is also published to AMPS by a
# write-behind thread (see qfj.seqno.* in src/main/resources/application.yml).
FileStorePath=${QFJ_STORE_DIR:data/store}
FileStoreSync=Y

# Session-level FIX logs (incoming/outgoing/events) go to files here as well
# as to the application log via SLF4J.
FileLogPath=log/fix
FileLogHeartbeats=N

UseDataDictionary=Y
DataDictionary=config/dictionary/FIX42.xml
# The enrichment tags (5001-5004) are declared in the dictionary's <fields>
# but in no <message>, so user-defined-field validation stays off.
ValidateUserDefinedFields=N
AllowUnknownMsgFields=Y

# A drop-copy session never resets by the clock: the sequence numbers live
# for the life of the session, which is what makes replicating them useful.
NonStopSession=Y
StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30
ResetOnLogon=N
ResetOnLogout=N
ResetOnDisconnect=N
RefreshOnLogon=N

# Leave RejectMessageOnUnhandledException at its default (N): an exception out
# of fromApp -- a destination that could not deliver -- then leaves the
# inbound sequence number un-incremented, so the counterparty's next message
# triggers a resend request and the message is redelivered.
RejectMessageOnUnhandledException=N

[session]
BeginString=FIX.4.2
SenderCompID=VENUE
TargetCompID=DROPCOPY
