syntax = "proto3";

package com.demo.amps.market.v1;

option java_package = "com.demo.amps.market.v1";
option java_multiple_files = true;
option java_outer_classname = "InstrumentProto";

// The "large record, small change" entity that motivates delta publishing.
//
// A snapshot is dominated by `reference`, which is static for the life of the
// instrument, while `quote` changes several times a second. Publishing the whole
// snapshot on every tick writes the static bytes into the transaction log over
// and over; publishing a delta writes only the quote. The journal-size lab
// (clients: `journal-lab`) measures exactly that difference on disk.
message InstrumentSnapshot {
  // SOW key: <Key>/symbol</Key>.
  string symbol = 1;

  // ~1-2 KB of data that essentially never changes after instrument setup.
  ReferenceData reference = 2;

  // Tens of bytes that change on every tick.
  Quote quote = 3;

  // Top-of-book depth. Arrays are replaced as a unit by AMPS delta updates, so
  // touching one level re-sends the whole ladder.
  repeated PriceLevel book = 4;

  int32 revision = 5;
  double updated_at_epoch_seconds = 6;
}

message ReferenceData {
  string long_name = 1;
  string exchange = 2;
  string currency = 3;
  string isin = 4;
  string cusip = 5;
  string sedol = 6;
  string figi = 7;
  string sector = 8;
  string industry = 9;
  string country = 10;
  int32 lot_size = 11;
  double tick_size = 12;
  string settlement_cycle = 13;
  repeated string trading_calendar = 14;
  repeated string eligible_venues = 15;
  string prospectus_url = 16;
  string legal_entity_identifier = 17;
  bool short_sale_eligible = 18;
  bool options_eligible = 19;
  double margin_rate = 20;
}

message Quote {
  double bid = 1;
  double ask = 2;
  int32 bid_size = 3;
  int32 ask_size = 4;
  double last = 5;
  int32 last_size = 6;
  // Kept int32 on purpose: an int64 would serialize as a quoted string and
  // could not be compared numerically in an AMPS filter.
  int32 sequence = 7;
}

message PriceLevel {
  int32 level = 1;
  double bid_price = 2;
  int32 bid_size = 3;
  double ask_price = 4;
  int32 ask_size = 5;
}
